<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b081a"/>
      <stop offset="50%" stop-color="#14102e"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="180" fill="#a855f7" opacity="0.06"/>
  <circle cx="1400" cy="750" r="220" fill="#6366f1" opacity="0.06"/>
  <circle cx="800" cy="450" r="300" fill="#06b6d4" opacity="0.04"/>

  <!-- Floating glow spots -->
  <circle cx="300" cy="200" r="80" fill="#a855f7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="1300" cy="650" r="100" fill="#6366f1" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Emoji icon -->
  <text x="800" y="240" text-anchor="middle" font-size="80">📚</text>

  <!-- Title -->
  <text x="800" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="2">
    Study<tspan fill="url(#accent1)">Vault</tspan>
  </text>

  <!-- Tagline -->
  <text x="800" y="420" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#a1a1aa" letter-spacing="1">
    Study without barriers. Support if you can.
  </text>

  <!-- Subtitle -->
  <text x="800" y="480" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#71717a" letter-spacing="0.5">
    Free PYQs, notes &amp; study resources for every Indian student
  </text>

  <!-- Divider line -->
  <line x1="600" y1="530" x2="1000" y2="530" stroke="url(#accent1)" stroke-width="2" opacity="0.5"/>

  <!-- Feature pills -->
  <rect x="470" y="570" rx="20" ry="20" width="180" height="40" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
  <text x="560" y="596" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#c4b5fd">📄  PYQs</text>

  <rect x="680" y="570" rx="20" ry="20" width="180" height="40" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  <text x="770" y="596" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a5b4fc">📝  Notes</text>

  <rect x="890" y="570" rx="20" ry="20" width="180" height="40" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="980" y="596" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#67e8f9">📖  Guides</text>

  <!-- Bottom bar -->
  <rect x="400" y="680" rx="12" ry="12" width="800" height="50" fill="#1e1b4b" opacity="0.6"/>
  <text x="800" y="712" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#71717a">
    Built by students, for students across India — 100% free, forever
  </text>

  <!-- Small decorative stars -->
  <text x="300" y="750" font-size="14" fill="#a855f7" opacity="0.3">✦</text>
  <text x="1320" y="200" font-size="12" fill="#6366f1" opacity="0.3">✦</text>
  <text x="480" y="180" font-size="10" fill="#06b6d4" opacity="0.25">✦</text>
  <text x="1150" y="780" font-size="16" fill="#a855f7" opacity="0.25">✦</text>
</svg>
